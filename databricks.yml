# Databricks Asset Bundle – deploy with:  databricks bundle deploy -t dev
bundle:
  name: azure-retail-lakehouse

variables:
  catalog:
    description: Unity Catalog catalog for all layers
    default: retail_lakehouse
  storage_account:
    description: ADLS Gen2 account name (leave empty to use UC Volumes)
    default: ""
  secret_scope:
    description: Databricks secret scope holding the service-principal credentials
    default: adls

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-REPLACE_ME.azuredatabricks.net
  prod:
    mode: production
    workspace:
      host: https://adb-REPLACE_ME.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_lakehouse_prod

resources:
  jobs:
    retail_lakehouse_pipeline:
      name: retail-lakehouse-${bundle.target}
      schedule:
        quartz_cron_expression: "0 30 2 * * ?"  # daily 02:30 IST (30 min after the ADF trigger)
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            data_security_mode: SINGLE_USER
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              first_on_demand: 1
            autotermination_minutes: 20
      tasks:
        - task_key: setup
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
            base_parameters: &params
              catalog: ${var.catalog}
              storage_account: ${var.storage_account}
              secret_scope: ${var.secret_scope}
        - task_key: bronze_ingestion
          depends_on: [{task_key: setup}]
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters: *params
        - task_key: silver_transformation
          depends_on: [{task_key: bronze_ingestion}]
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ./notebooks/02_silver_transformation.py
            base_parameters: *params
        - task_key: gold_aggregates
          depends_on: [{task_key: silver_transformation}]
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ./notebooks/03_gold_aggregates.py
            base_parameters: *params
